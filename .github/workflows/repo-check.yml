name: repo-check

on:
  push:
  pull_request:

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile helper scripts
        run: python -m py_compile scripts/*.py
      - name: Check accidental secrets
        shell: bash
        run: |
          if grep -RInE 'sk-[A-Za-z0-9_-]{20,}|apiKey"[[:space:]]*:[[:space:]]*"[^$]' . --exclude-dir=.git; then
            echo "Potential hard-coded secret found"
            exit 1
          fi
